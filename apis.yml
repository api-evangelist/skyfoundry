aid: skyfoundry
name: SkyFoundry
description: >-
  SkyFoundry, founded in 2009 and headquartered in Glen Allen, Virginia,
  develops SkySpark, an analytics and informatics platform that connects,
  stores, analyzes, and visualizes data from smart devices, automation and
  control systems, meters, and sensors to "find what matters" in large equipment
  and facility datasets. SkySpark automatically detects issues, patterns,
  deviations, faults, and cost-reduction opportunities across intelligent
  buildings, industrial, agriculture, energy, government, and healthcare
  facilities, and has been applied to over 15,000 buildings spanning more than a
  billion square feet. SkySpark is a native Project Haystack server: external
  applications integrate through the Haystack HTTP REST API (ops such as read,
  hisRead, hisWrite, pointWrite, watchSub/watchPoll, eval, commit, and nav) with
  Zinc, JSON, Trio, and CSV data formats, and authenticate using the Haystack
  SCRAM (SHA-256) handshake with bearer authTokens. The company sells through a
  network of 140+ OEM, systems-integrator, and value-added-distributor channel
  partners rather than a self-service public SaaS.
