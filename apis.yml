apis:
- name: SkySpark REST API (Project Haystack)
  description: >-
    SkySpark is a native Project Haystack server. External applications integrate
    through the Haystack HTTP REST API, exposing operations such as about, read,
    hisRead, hisWrite, pointWrite, watchSub, watchPoll, watchUnsub, nav, eval, and
    commit over Zinc, JSON, Trio, and CSV. Endpoints follow the pattern
    /api/{proj}/{op} on each self-hosted SkySpark instance; authentication uses the
    Haystack SCRAM (SHA-256) handshake, after which a bearer authToken is presented
    via the Authorization header. There is no single public multi-tenant host —
    each customer runs its own SkySpark server.
